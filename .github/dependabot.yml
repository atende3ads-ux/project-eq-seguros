# Atualizações de dependências e correções de segurança, toda segunda de manhã.
# O Payload e o Next.js sobem em grupos, porque os pacotes de cada um precisam andar juntos.
# Atualização do Payload costuma pedir migração de banco: o CI avisa se faltar (ver ci.yml).
version: 2
updates:
  - package-ecosystem: npm
    directory: /Index
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    open-pull-requests-limit: 5
    labels: [dependencias]
    # Saltos de versão maior que sabemos que quebram o projeto e pedem decisão manual:
    # graphql 17 conflita com o Payload (exige 16); TypeScript 7 removeu opções que usamos;
    # @types/node precisa acompanhar o Node do Docker (24).
    ignore:
      - { dependency-name: graphql, update-types: ["version-update:semver-major"] }
      - { dependency-name: typescript, update-types: ["version-update:semver-major"] }
      - { dependency-name: "@types/node", update-types: ["version-update:semver-major"] }
    groups:
      payload: { patterns: [payload, "@payloadcms/*"] }
      next-react: { patterns: [next, react, react-dom, "@types/react", "@types/react-dom"] }
      outras: { update-types: [minor, patch], exclude-patterns: [payload, "@payloadcms/*", next, react, react-dom, "@types/react", "@types/react-dom"] }
  - package-ecosystem: docker
    directory: /Index
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    labels: [dependencias]
    # Só as versões LTS (pares) do Node em produção; a troca de versão maior é decisão manual.
    ignore:
      - { dependency-name: node, update-types: ["version-update:semver-major"] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/Sao_Paulo }
    labels: [dependencias]
